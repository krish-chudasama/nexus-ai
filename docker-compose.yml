# Secrets come from your local .env (never baked into the image).
x-common: &common
  build:
    context: .
    args:
      INSTALL_ML: "${INSTALL_ML:-true}"
  env_file:
    - path: .env
      required: false
  environment:
    DATA_DIR: /app/data
    EVALS_DIR: /app/evals
  volumes:
    - nexus-data:/app/data
    - ./evals:/app/evals

services:
  api:
    <<: *common
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  ui:
    <<: *common
    command: ["streamlit", "run", "app/frontend/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    environment:
      API_URL: http://api:8000
    ports: ["8501:8501"]
    depends_on:
      api:
        condition: service_healthy

volumes:
  nexus-data:
