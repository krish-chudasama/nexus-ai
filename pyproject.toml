[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-ai"
version = "0.1.0"
description = "NEXUS AI - Intelligent Knowledge & Agent Assistant (RAG + Agent + MCP + Evals)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "python-multipart>=0.0.9",
  "chromadb>=0.5",
  "pymupdf>=1.24",
  "python-docx>=1.1",
  "mcp>=1.2",
  "openai>=1.30",
  "httpx>=0.27",
  "numpy>=1.26",
]

[project.optional-dependencies]
# Local semantic embeddings + optional cross-encoder reranking (pulls in PyTorch).
ml = ["sentence-transformers>=3.0"]
ui = ["streamlit>=1.35"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends() in argument defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"app/frontend/theme.py" = ["E501"]  # embedded CSS
